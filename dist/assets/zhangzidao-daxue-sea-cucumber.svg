<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
  <title id="title">海参通用形态示意</title>
  <desc id="desc">暖灰纸色背景上的海参形态编辑插画，不是獐子岛实拍或野生身份鉴别。</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#eee9dc"/><stop offset="1" stop-color="#d8d2c3"/></linearGradient>
    <linearGradient id="body" x2=".1" y2="1"><stop stop-color="#786d58"/><stop offset=".45" stop-color="#4d5146"/><stop offset="1" stop-color="#292f2a"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="660" fill="url(#paper)"/>
  <path d="M0 500c170-45 340-40 500-5s285 27 400-4v169H0z" fill="#c4bba8" opacity=".55"/>
  <ellipse cx="460" cy="489" rx="280" ry="45" fill="#77715f" opacity=".2"/>
  <g transform="rotate(-7 455 355)">
    <path d="M197 366c13-100 68-174 158-202 85-27 166-1 207 51 34 43 53 107 112 160 26 24 34 51 19 77-18 31-58 33-88 20-29-13-50-37-77-41-51-8-94 43-162 51-72 8-149-22-169-69-7-16-6-31 0-47z" fill="url(#body)" stroke="#383d35" stroke-width="8"/>
    <path d="M234 344c22-76 74-124 140-145 52-16 100-10 139 13" fill="none" stroke="#d5cbb2" stroke-width="16" stroke-linecap="round" opacity=".25"/>
    <ellipse cx="417" cy="324" rx="240" ry="165" fill="url(#light)"/>
    <g fill="#b8a98b" opacity=".7">
      <circle cx="282" cy="407" r="8"/><circle cx="314" cy="441" r="7"/><circle cx="356" cy="457" r="6"/><circle cx="401" cy="462" r="7"/><circle cx="450" cy="450" r="6"/><circle cx="503" cy="426" r="8"/><circle cx="553" cy="404" r="6"/><circle cx="604" cy="394" r="7"/><circle cx="654" cy="399" r="6"/>
      <circle cx="299" cy="289" r="5"/><circle cx="333" cy="257" r="6"/><circle cx="377" cy="238" r="5"/><circle cx="420" cy="232" r="5"/>
    </g>
  </g>
  <text x="52" y="78" fill="#536255" font-family="serif" font-size="24" letter-spacing="4">SHORELINE · WINTER</text>
  <text x="52" y="615" fill="#536255" font-family="serif" font-size="20" letter-spacing="2">海参形态参考 · 非实拍与身份鉴别</text>
