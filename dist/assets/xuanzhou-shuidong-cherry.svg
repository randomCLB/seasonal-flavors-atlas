<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">鲜樱桃编辑插画</title>
  <desc id="desc">暖白纸色背景上，三枚红色樱桃连着细梗与一片青叶；通用形态参考，不是宣州水东实拍。</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f5f0e5"/><stop offset="1" stop-color="#e9e1d2"/></linearGradient>
    <radialGradient id="fruit" cx="35%" cy="28%" r="75%"><stop stop-color="#e77768"/><stop offset=".42" stop-color="#b93735"/><stop offset="1" stop-color="#671f2b"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b9c67"/><stop offset="1" stop-color="#344d3b"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#paper)"/>
  <path d="M0 700 Q260 630 506 720T1200 690V900H0Z" fill="#ded4c1" opacity=".48"/>
  <ellipse cx="604" cy="675" rx="310" ry="42" fill="#3f2b29" opacity=".16" filter="url(#shadow)"/>
  <path d="M604 510 C610 390 550 270 444 176 M610 511 C649 372 743 284 843 220 M615 510 C671 397 830 374 933 388" fill="none" stroke="#4c4636" stroke-width="15" stroke-linecap="round"/>
  <path d="M444 176 C505 138 594 144 650 192 C598 252 517 265 444 176Z" fill="url(#leaf)"/>
  <path d="M482 188 Q554 192 632 199" fill="none" stroke="#c5c59c" stroke-width="4" opacity=".75"/>
  <path d="M843 220 C912 195 1003 221 1032 281 C962 324 882 300 843 220Z" fill="url(#leaf)"/>
  <path d="M869 235 Q944 255 1015 273" fill="none" stroke="#c5c59c" stroke-width="4" opacity=".75"/>
  <g stroke="#5a252c" stroke-width="9">
    <path d="M477 430 Q427 527 399 583" fill="none"/>
    <path d="M678 444 Q740 535 766 595" fill="none"/>
    <path d="M893 438 Q928 521 919 585" fill="none"/>
  </g>
  <g>
    <circle cx="386" cy="626" r="122" fill="url(#fruit)"/>
    <circle cx="753" cy="642" r="130" fill="url(#fruit)"/>
    <circle cx="923" cy="627" r="108" fill="url(#fruit)"/>
    <path d="M328 580 Q352 534 394 528" fill="none" stroke="#ffd2ad" stroke-width="13" stroke-linecap="round" opacity=".54"/>
    <path d="M692 586 Q717 544 759 537" fill="none" stroke="#ffd2ad" stroke-width="13" stroke-linecap="round" opacity=".52"/>
    <path d="M881 586 Q903 552 938 550" fill="none" stroke="#ffd2ad" stroke-width="11" stroke-linecap="round" opacity=".5"/>
    <circle cx="427" cy="672" r="8" fill="#401f28"/><circle cx="786" cy="694" r="8" fill="#401f28"/><circle cx="950" cy="672" r="7" fill="#401f28"/>
  </g>
  <path d="M98 125h178M98 145h91" stroke="#9b7b58" stroke-width="3" opacity=".65"/>
  <text x="100" y="105" fill="#6a5a43" font-family="serif" font-size="24" letter-spacing="5">LATE SPRING · FRESH FRUIT</text>
  <text x="100" y="808" fill="#18342e" font-family="serif" font-size="32">水东鲜樱桃 · 通用形态编辑插画</text>
</svg>
