  </g>
  <g fill="#d4a653" stroke="#f0d58f" stroke-width="4">
    <circle cx="390" cy="232" r="16"/><circle cx="368" cy="210" r="11"/><circle cx="414" cy="203" r="11"/><circle cx="550" cy="177" r="17"/><circle cx="527" cy="153" r="11"/><circle cx="574" cy="151" r="11"/><circle cx="755" cy="241" r="16"/><circle cx="733" cy="218" r="11"/><circle cx="780" cy="214" r="11"/><circle cx="905" cy="181" r="17"/><circle cx="882" cy="157" r="11"/><circle cx="928" cy="154" r="11"/>
  </g>
  <g fill="#756653" font-family="serif"><text x="78" y="110" font-size="27" letter-spacing="7">AUTUMN GREENS · CAIDIAN</text><text x="80" y="765" font-size="20" letter-spacing="4">EDITORIAL STUDY · NOT A CULTIVAR IDENTIFICATION</text></g>
