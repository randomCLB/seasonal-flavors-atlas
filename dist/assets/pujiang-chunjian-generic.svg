    <radialGradient id="pith" cx="40%" cy="35%" r="70%"><stop stop-color="#fff5d8"/><stop offset="1" stop-color="#e5c98c"/></radialGradient>
    <linearGradient id="bowl" x2="0" y2="1"><stop stop-color="#d7d0b8"/><stop offset="1" stop-color="#9ca58d"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
