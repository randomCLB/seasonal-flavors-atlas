  </g>
  <path d="M339 338 C394 300 443 286 491 278 M762 352 C810 319 852 302 900 296" fill="none" stroke="#556948" stroke-width="13" stroke-linecap="round"/>
  <path d="M430 303 C394 249 338 245 300 269 C326 318 376 335 430 303Z" fill="#61744e"/>
  <path d="M816 323 C844 265 898 250 940 274 C925 326 875 350 816 323Z" fill="#6b7b51"/>
</svg>
