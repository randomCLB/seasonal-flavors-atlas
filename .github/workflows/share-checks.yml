name: Check ingredient sharing
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-reader-release.cjs
      - run: |
          node --check dist/food-share.js
          node --test tests/*.test.cjs > /tmp/share-tests.tap 2>&1 || { grep -A 24 '^not ok' /tmp/share-tests.tap; tail -12 /tmp/share-tests.tap; exit 1; }
          tail -12 /tmp/share-tests.tap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0 && python -m playwright install --with-deps chromium
      - name: Test mobile and desktop share flows
        run: |
          python -m http.server 8766 --directory dist > /tmp/atlas-server.log 2>&1 &
          python scripts/test-food-share-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingredient-share-browser-checks
          path: |
            /tmp/atlas-share-*.png
            /tmp/atlas-share-browser.json
            /tmp/share-tests.tap
          retention-days: 7
