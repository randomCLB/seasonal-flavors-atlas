name: Reader access and media
on:
  push:
    branches: [fix/reader-access-media-20261024]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-reader-release.cjs && node scripts/audit-reader-access.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-access-audit
          path: /tmp/reader-access.json
          retention-days: 14
  photograph-review:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-missing-covers.cjs && node scripts/review-exact-covers.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-cover-candidates
          path: /tmp/missing-cover-candidates/
          retention-days: 14
