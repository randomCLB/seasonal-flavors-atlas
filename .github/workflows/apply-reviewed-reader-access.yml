name: Apply reviewed reader access release
on:
  push:
    branches: [fix/reader-access-media-20261024]
    paths: [.github/workflows/apply-reviewed-reader-access.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.actor == 'randomCLB' && github.repository == 'randomCLB/seasonal-flavors-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: missing-cover-candidates
          run-id: 40133160402
          github-token: ${{ github.token }}
          path: /tmp/reviewed-reader-photos-1
      - uses: actions/download-artifact@v4
        with:
          name: missing-cover-candidates
          run-id: 40133687837
          github-token: ${{ github.token }}
          path: /tmp/reviewed-reader-photos-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply hash-pinned scoped patch and visually reviewed photographs
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,re,subprocess
          from PIL import Image,ImageOps
          allowed=set('dist/food-detail.js dist/food-media.js dist/food-purchase.js dist/food-records.js dist/lottery-ui.js dist/reader-access.css dist/reader-access.js dist/reader-media-additions.js dist/tarot-spread-ui.js docs/READER_ACCESS_AND_MEDIA_20261024.md docs/READER_MEDIA_20261024.json scripts/audit-reader-access.cjs scripts/prepare-ingredient-identity.cjs scripts/prepare-reader-access.cjs scripts/prepare-reader-release.cjs scripts/test-ingredient-identity-browser.py scripts/test-reader-access-browser.py scripts/test-reader-browser.py tests/reader-access.test.cjs'.split())
          encoded=''.join(Path(f'scripts/.reader-access-patch-{i}.b64').read_text().strip() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=134217728)
          assert len(patch)==81179
          assert hashlib.sha256(patch).hexdigest()=='19f864fc861dc7f1970d235192478f765f9ee9a874f6f99dc84c1f236a022339'
          paths=re.findall(r'^\+\+\+ b/(.+)$',patch.decode(),re.M)
          assert set(paths)==allowed and len(paths)==len(allowed)
          for old in re.findall(r'^--- (.+)$',patch.decode(),re.M):assert old=='/dev/null' or old.startswith('a/') and old[2:] in allowed
          Path('/tmp/reader-access.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/reader-access.patch'],check=True)
          subprocess.run(['git','apply','/tmp/reader-access.patch'],check=True)
          manifest_file=Path('docs/READER_MEDIA_20261024.json')
          manifest=json.loads(manifest_file.read_text())
          assert len(manifest)==9
          directories={40133160402:Path('/tmp/reviewed-reader-photos-1'),40133687837:Path('/tmp/reviewed-reader-photos-2')}
          photographs=[]
          for item in manifest:
              assert re.fullmatch(r'assets/reader-media/[a-z0-9_-]+\.webp',item['path'])
              assert Path(item['filename']).name==item['filename']
              source=directories[item['reviewRun']]/item['filename']
              original=source.read_bytes()
              assert hashlib.sha256(original).hexdigest()==item['sourceSha256'],str(source)
              target=Path('dist')/item['path'];target.parent.mkdir(parents=True,exist_ok=True)
              with Image.open(source) as image:
                  image=ImageOps.exif_transpose(image)
                  image.thumbnail((960,960),Image.Resampling.LANCZOS)
                  if image.mode not in ('RGB','RGBA'):image=image.convert('RGB')
                  image.save(target,format='WEBP',quality=82,method=6)
              item['sha256']=hashlib.sha256(target.read_bytes()).hexdigest()
              photographs.append(str(target))
          manifest_file.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['git','add','--',*sorted(allowed),*photographs],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          Path('/tmp/reader-import-result.json').write_text(json.dumps({'patchSha256':hashlib.sha256(patch).hexdigest(),'files':sorted(allowed),'photographs':manifest},ensure_ascii=False,indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staged source before branch-only commit
        run: |
          node scripts/prepare-reader-release.cjs
          node --test tests/reader-access.test.cjs
          find dist -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Gate regional seafood by useful access evidence and share verified ingredient photos'
          git push origin HEAD:refs/heads/fix/reader-access-media-20261024
          git rev-parse HEAD > /tmp/reader-import-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-access-import-receipt
          path: |
            /tmp/reader-import-result.json
            /tmp/reader-import-commit.txt
          retention-days: 30
