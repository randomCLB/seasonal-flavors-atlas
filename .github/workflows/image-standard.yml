name: Plant to plate image standard
on:
  push:
    branches: [fix/plant-to-plate-20261024]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-feature-plants.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-plant-candidates
          path: /tmp/feature-plants/
          retention-days: 7
