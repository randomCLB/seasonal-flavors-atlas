name: Apply reviewed food pool expansion
on:
  push:
    branches: [feature/seasonal-pool-expansion]
    paths: [.github/workflows/apply-pool-expansion.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: apply-reviewed-pool-expansion
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/seasonal-pool-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/seasonal-pool-expansion
          fetch-depth: 2
      - name: Verify exact isolated starting point
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test "$(git rev-parse HEAD^)" = d4bb3357e146113c536838f66ad758ad0e5a4bc5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: expansion-media-review
          run-id: 36711566514
          github-token: ${{ github.token }}
          path: .expansion-media
      - name: Apply exact reviewed texts and images
        run: python3 .expansion-payload/apply.py
      - name: Run all old and new tests
        run: |
          set -o pipefail
          for file in dist/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs | tee /tmp/expansion-tests.txt
          node scripts/audit-tarot-pool.cjs 2027 > /tmp/current-pool.json
          cmp docs/TAROT_POOL_COVERAGE_2027.json /tmp/current-pool.json
      - name: Remove transport payload; leave workflow writes to the connector
        run: |
          rm -rf .expansion-payload .expansion-media
          git restore --source=HEAD -- .github/workflows
      - name: Commit tested application changes to this branch only
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/seasonal-pool-expansion | cut -f1)" = "$TRIGGER_SHA"
          git add dist tests docs scripts reviews README.md IMAGE_REGISTER.md .expansion-payload
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: expand seasonal foods to 60 and rotate the full eligible tarot pool'
          git push origin HEAD:refs/heads/feature/seasonal-pool-expansion
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-regression-report
          path: |
            /tmp/expansion-tests.txt
            /tmp/current-pool.json
          retention-days: 7
