name: Apply reviewed plant to plate images
on:
  push:
    branches: [fix/plant-to-plate-20261024]
    paths: [.github/workflows/apply-reviewed-visual.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.actor == 'randomCLB' && github.repository == 'randomCLB/seasonal-flavors-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: plant-to-plate-candidates
          run-id: 40164026436
          github-token: ${{ github.token }}
          path: /tmp/visual-sources/12587462934
      - uses: actions/download-artifact@v4
        with:
          name: visual-target-candidates
          run-id: 40164296237
          github-token: ${{ github.token }}
          path: /tmp/visual-sources/12587238965
      - uses: actions/download-artifact@v4
        with:
          name: final-visual-candidates
          run-id: 40164687311
          github-token: ${{ github.token }}
          path: /tmp/visual-sources/12587079801
      - uses: actions/download-artifact@v4
        with:
          name: feature-plant-candidates
          run-id: 40165206096
          github-token: ${{ github.token }}
          path: /tmp/visual-sources/12588590242
      - uses: actions/download-artifact@v4
        with:
          name: visual-corrections
          run-id: 40165955183
          github-token: ${{ github.token }}
          path: /tmp/visual-sources/12587927842
      - uses: actions/download-artifact@v4
        with:
          name: botanical-replacements
          run-id: 40166178853
          github-token: ${{ github.token }}
          path: /tmp/visual-sources/12587993095
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply exact scoped source and reviewed photographic derivatives
        run: |
          python - <<'PY'
          import hashlib,json,lzma,subprocess
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          packed=b''.join(Path(f'.bridge/visual-update.part{i}').read_bytes() for i in range(6))
          assert hashlib.sha256(packed).hexdigest()=='60b6c4d65d9f87c132f7a70487751093949794445c01df1cebf8bfb6512be415'
          bundle=json.loads(lzma.decompress(packed))
          assert bundle['format']==2
          allowed=set('dist/visual-standard.js dist/visual-standard.css dist/food-media.js dist/food-detail.js scripts/audit-visual-standard.cjs scripts/audit-reader-access.cjs scripts/prepare-reader-release.cjs scripts/prepare-visual-standard.cjs scripts/test-visual-standard-browser.py scripts/test-reader-access-browser.py scripts/test-reader-browser.py tests/visual-standard.test.cjs tests/reader-access.test.cjs tests/ingredient-photo-priority.test.cjs docs/IMAGE_STANDARD_20261024.md docs/VISUAL_COVERAGE_20261024.json .github/workflows/image-standard.yml'.split())
          assert {f['path'] for f in bundle['files']}==allowed
          for f in bundle['files']:
              target=Path(f['path'])
              if f['beforeBlob']:
                  raw=target.read_bytes()
                  actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  assert actual==f['beforeBlob'],f['path']+': changed source'
              else:
                  assert not target.exists(),f['path']+': unexpected existing file'
          for f in bundle['files']:
              target=Path(f['path']);target.parent.mkdir(parents=True,exist_ok=True)
              if 'patch' in f:
                  patch=f['patch'].encode()
                  subprocess.run(['git','apply','--check','-'],input=patch,check=True)
                  subprocess.run(['git','apply','-'],input=patch,check=True)
              else:
                  target.write_text(f['content'],encoding='utf-8')
          manifest=[]
          for spec in bundle['photos']:
              rel=Path(spec['path'])
              assert rel.parent==Path('assets/visual') and rel.suffix=='.webp' and '..' not in rel.parts
              a=spec['inputArtifact'];folder=Path('/tmp/visual-sources')/str(a['id'])
              assert Path(a['filename']).name==a['filename']
              source=folder/a['filename'];raw=source.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==spec['sourceSha256'],str(source)
              metadata=next(r for r in json.loads((folder/'candidates.json').read_text()) if r.get('filename')==a['filename'])
              assert metadata['sha256']==spec['sourceSha256']
              target=Path('dist')/rel;target.parent.mkdir(parents=True,exist_ok=True)
              t=spec['treatment']
              with Image.open(source) as original:
                  image=ImageOps.exif_transpose(original).convert('RGB')
                  if spec.get('crop'):image=image.crop(tuple(spec['crop']))
                  image.thumbnail((t['maxEdge'],t['maxEdge']),Image.Resampling.LANCZOS)
                  image=ImageEnhance.Color(image).enhance(t['saturation'])
                  image=ImageEnhance.Contrast(image).enhance(t['contrast'])
                  image.save(target,format='WEBP',quality=t['quality'],method=t['method'])
                  width,height=image.size
              entry={key:metadata.get(key,'') for key in ['source','url','artist','license','licenseUrl','title']}
              entry.update(spec);entry.update(sha256=hashlib.sha256(target.read_bytes()).hexdigest(),width=width,height=height)
              manifest.append(entry)
          assert len(manifest)==44
          manifest_path=Path('docs/VISUAL_MEDIA_20261024.json')
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          subprocess.run(['git','add',*sorted(allowed),str(manifest_path),'dist/assets/visual'],check=True)
          print(json.dumps({'sourceFiles':len(allowed),'reviewedPhotographs':len(manifest)},ensure_ascii=False))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and stage only reviewed changes
        run: |
          node --check dist/visual-standard.js
          node --check dist/food-media.js
          node --check dist/food-detail.js
          node scripts/prepare-reader-release.cjs
          node --test tests/visual-standard.test.cjs tests/reader-access.test.cjs tests/reader-copy.test.cjs tests/ingredient-photo-priority.test.cjs
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate botanical covers from plated detail images and replace misleading shared photographs'
          git push origin HEAD:refs/heads/fix/plant-to-plate-20261024
