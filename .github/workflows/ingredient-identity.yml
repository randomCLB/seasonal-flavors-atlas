name: Ingredient identity
on:
  push:
    branches: [fix/ingredient-identity-20261024]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every ingredient identity and existing grouping
        run: node scripts/audit-ingredient-identity.cjs
        env:
          IDENTITY_AUDIT_OUTPUT: /tmp/ingredient-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingredient-identity
          path: /tmp/ingredient-identity.json
          retention-days: 30
