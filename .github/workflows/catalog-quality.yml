name: Catalog quality
on:
  push:
    branches: [fix/catalog-depth-20261024]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit visibility and reader detail density
        run: |
          node scripts/prepare-reader-release.cjs
          node scripts/audit-catalog-quality.cjs > /tmp/catalog-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-quality
          path: /tmp/catalog-quality.json
          retention-days: 14
  photo-review:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-extra-photos.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-photo-candidates-extra
          path: /tmp/catalog-photos-extra/
          retention-days: 14
