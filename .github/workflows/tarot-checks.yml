name: Check tarot and preserve flavor draw
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v1.1-tarot, feature/v1.1-tarot-spread]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tarot syntax
        run: |
          node --check dist/app.js
          node --check dist/tarot-deck.js
          node --check dist/tarot-core.js
          node --check dist/tarot-ui.js
          node --check dist/tarot-spread.js
          node --check dist/tarot-spread-ui.js
      - name: Test default navigation, flavor draw, tarot, and expanded pool
        run: node --test tests/*.test.cjs
      - name: Verify reproducible yearly pool audit
        run: |
          node scripts/audit-tarot-pool.cjs 2027 > /tmp/tarot-pool.json
          cmp docs/TAROT_POOL_COVERAGE_2027.json /tmp/tarot-pool.json
