name: Check tarot and preserve flavor draw
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v1.1-tarot, feature/v1.1-tarot-spread]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-reader-release.cjs
      - name: Check JavaScript syntax
        run: find dist -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Full regression suite
        run: |
          node --test tests/*.test.cjs > /tmp/reader-tests.tap 2>&1 || { grep -A 24 '^not ok' /tmp/reader-tests.tap; tail -12 /tmp/reader-tests.tap; exit 1; }
          tail -12 /tmp/reader-tests.tap
      - name: Preserve seasonal draw coverage
        run: |
          node scripts/audit-tarot-pool.cjs 2027 > /tmp/tarot-pool.json
          cmp docs/TAROT_POOL_COVERAGE_2027.json /tmp/tarot-pool.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-full-regression
          path: /tmp/reader-tests.tap
          retention-days: 30
