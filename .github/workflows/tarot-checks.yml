name: Check tarot and preserve flavor draw
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/v1.1-tarot, feature/v1.1-tarot-spread]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tarot syntax
        run: |
          node --check dist/app.js
          node --check dist/tarot-deck.js
          node --check dist/tarot-core.js
          node --check dist/tarot-ui.js
          node --check dist/tarot-spread.js
          node --check dist/tarot-spread-ui.js
      - name: Test default navigation, flavor draw, tarot, and three-card spread
        run: node --test tests/draw-navigation.test.cjs tests/lottery.test.cjs tests/tarot.test.cjs tests/tarot-spread.test.cjs
