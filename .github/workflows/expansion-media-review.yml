name: Review expansion photo assets
on:
  push:
    branches: [feature/seasonal-pool-expansion]
    paths: [.github/workflows/expansion-media-review.yml]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install image tooling
        run: python3 -m pip install Pillow==11.3.0
      - name: Fetch five explicitly licensed references
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, time, urllib.parse, urllib.request
          from PIL import Image, ImageOps
          rows = [
            ('Shelled_castanea_henryi.jpg','jianou-zhuilli-reference.webp','Fumikas Sagisavas','CC0-1.0'),
            ('Lablab-bean_pods.jpg','chongming-biandou-reference.webp','Fumikas Sagisavas','CC0-1.0'),
            ('Boiled_taro.png','chongming-taro-reference.webp','Rtnf','CC-BY-SA-4.0'),
            ('Allium_chinense_Rakkyo.JPG','xiangyin-jiaotou-reference.webp','Midori','CC-BY-SA-3.0'),
            ('White_turnip_2017_A1.jpg','wenzhou-pancai-reference.webp','Fructibus','CC0-1.0')
          ]
          out=pathlib.Path('expansion-media'); out.mkdir()
          manifest=[]
          for filename,dest,author,license in rows:
              h=hashlib.md5(filename.encode()).hexdigest()
              url='https://upload.wikimedia.org/wikipedia/commons/'+h[0]+'/'+h[:2]+'/'+urllib.parse.quote(filename)
              data=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Fengwu-food-atlas/1.1 (https://github.com/randomCLB/seasonal-flavors-atlas; licensed food photo review)'})
                      with urllib.request.urlopen(req,timeout=40) as r:
                          if r.status!=200: raise RuntimeError(str(r.status))
                          data=r.read(20000001)
                      if len(data)>20000000: raise RuntimeError('Image exceeds review limit')
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(4*(attempt+1))
              image=ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
              original=image.size; image.thumbnail((1400,1100))
              image.save(out/dest,'WEBP',quality=86,method=6)
              manifest.append({'file':dest,'sourceFile':filename,'sourceURL':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(filename),'originalURL':url,'author':author,'license':license,'originalSize':original,'size':image.size,'sha256':hashlib.sha256((out/dest).read_bytes()).hexdigest()})
              print(dest, image.size, len((out/dest).read_bytes()))
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-media-review
          path: expansion-media/
          retention-days: 7
