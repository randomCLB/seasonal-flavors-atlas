name: Publish atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and test the exact release
        run: |
          node scripts/prepare-reader-release.cjs
          find dist -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --test tests/*.test.cjs > /tmp/publish-tests.tap 2>&1 || { grep -A 24 '^not ok' /tmp/publish-tests.tap; tail -12 /tmp/publish-tests.tap; exit 1; }
          tail -12 /tmp/publish-tests.tap
          node scripts/audit-tarot-pool.cjs 2027 > /tmp/tarot-pool.json
          cmp docs/TAROT_POOL_COVERAGE_2027.json /tmp/tarot-pool.json
      - name: Compose site and compatible preview link
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          stable = pathlib.Path('dist')
          out = pathlib.Path('_site')
          shutil.copytree(stable, out)
          preview = out / 'preview' / 'v1.1'
          if preview.exists():
              raise SystemExit('Refusing to overwrite an existing preview directory')
          shutil.copytree(stable, preview)
          for p in preview.rglob('*.html'):
              p.write_text(p.read_text(encoding='utf-8').replace('<head>', '<head>\n<meta name="robots" content="noindex,nofollow">', 1), encoding='utf-8')
          checked = 0
          for source in stable.rglob('*'):
              if source.is_file():
                  if hashlib.sha256(source.read_bytes()).digest() != hashlib.sha256((out / source.relative_to(stable)).read_bytes()).digest():
                      raise SystemExit(f'Stable file changed: {source}')
                  checked += 1
          info = json.loads((out / 'build-info.json').read_text())
          info.update(previewCommit=os.environ['GITHUB_SHA'], entry='tarot.html', flavorEntry='lottery.html', siteFilesVerified=checked, status='v1.1-live')
          (preview / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          print(f'Verified {checked} site files')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public release bytes
        timeout-minutes: 4
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          root = pathlib.Path('_site')
          names = [p.name for p in pathlib.Path('dist').iterdir() if p.is_file() and p.suffix in ['.html','.js','.css','.json']]
          names += ['assets/tarot/' + c + '.webp' for c in ['sun','moon','star','temperance','fool','magician','hermit','empress','strength','hanged','wheel','world']]
          names += ['preview/v1.1/' + p for p in ['index.html','app.js','tarot.html','lottery.html','reader-copy.js','reader-copy-curation.js','build-info.json']]
          for attempt in range(8):
              try:
                  for name in names:
                      request = urllib.request.Request(base + name + '?deploy=' + os.environ['GITHUB_SHA'], headers={'User-Agent':'fengwu-release-verifier'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          body = response.read()
                          if response.status != 200: raise RuntimeError(f'{name}: HTTP {response.status}')
                      if hashlib.sha256(body).digest() != hashlib.sha256((root / name).read_bytes()).digest():
                          raise RuntimeError(f'{name}: deployed content differs')
                  break
              except Exception as exc:
                  if attempt == 7: raise
                  print(f'CDN verification attempt {attempt+1}: {exc}', flush=True)
                  time.sleep(10)
          info=json.loads((root/'build-info.json').read_text())
          print(json.dumps({'verifiedResources':len(names), **info}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write(f"## 时令风物\n\n[正式站]({base}) · 文案版 {info['readerVersion']}\n\n目录 {info['catalogCount']} 味。发布提交 `{info['siteCommit']}`。{len(names)} 个页面与资源通过公开地址 SHA-256 核对。\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-regression-evidence
          path: /tmp/publish-tests.tap
          retention-days: 30
